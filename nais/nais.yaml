apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: klage-job-status
  namespace: klage
  labels:
    team: klage
spec:
  port: 3000
  image: {{image}}
  replicas:
    min: 2
    max: 3
  resources:
    requests:
      cpu: 400m
      memory: 256Mi
    limits:
      memory: 512Mi
  ingresses:
    - https://klage-job-status.ekstern.dev.nav.no
  valkey:
    - instance: klage-job-status
      access: readwrite
  envFrom:
    - secret: klage-job-status
  observability:
    autoInstrumentation:
      enabled: true
      # The app configures its own OpenTelemetry SDK (see instrumentation.otel.ts), so only
      # the OTEL_* environment variables are injected - no auto-instrumentation agent.
      runtime: sdk
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      claims:
        extra:
          - NAVident
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /jobs/**
        - /_next/**
  liveness:
    path: /isAlive
    periodSeconds: 1
    timeout: 1
    failureThreshold: 10
  readiness:
    path: /isReady
    periodSeconds: 1
    timeout: 1
    failureThreshold: 10
  startup:
    path: /isStarted
    initialDelay: 3
    periodSeconds: 1
    timeout: 1
    failureThreshold: 10
