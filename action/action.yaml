name: 'Job status'

description: 'Check status for job'

inputs:
  api_key:
    description: 'Read API key'
    required: true
  job_id:
    description: 'ID for the job to check'
    required: true
  fail:
    description: 'Fail if job is failed'
    required: false
    default: 'true'
  fail_on_unknown:
    description: 'Fail if job status is unknown'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Job status'
    value: ${{ steps.status.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: navikt/klage-job-status

    - name: Install dependencies
      shell: bash
      working-directory: ./action
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Job status
      id: status
      shell: bash
      working-directory: ./action
      env:
        API_KEY: ${{ inputs.api_key }}
        JOB_ID: ${{ inputs.job_id }}
        FAIL: ${{ inputs.fail }}
        FAIL_ON_UNKNOWN: ${{ inputs.fail_on_unknown }}
      run: bun action.ts
