# Convenience compose file for running a local Valkey instance during development.
# Start it with `docker compose up -d`, then see the "Lokal utvikling" section in
# README.md for how to point the app at it. Not used by the app's own Docker image
# (see Dockerfile), which only copies the CI-built Next.js standalone output.
services:
  valkey:
    image: valkey/valkey:alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
